    {
      "new": "github.com/ReadyStackFree/go-archive",
      "old": "github.com/moby/go-archive",
      "version": "v0.3.0-cve-r1",
      "why": "CVE-2026-17106 (HIGH, path traversal in tar extraction, GHSA-hfg8-hc9c-6c3h). ReadyStack backport fork: upstream v0.3.0 carries the complete fix (PR #45) but dropped the deprecated root-level compression aliases after v0.1.0, and docker/cli still calls archive.Gzip (cli/command/image/build/context.go) - docker/cli pins go-archive v0.2.0 even at its newest v29.6.0, so NO upstream combination gives both fix and API. Our fork = upstream v0.3.0 UNMODIFIED plus a ~25-line file restoring those deprecated type/const aliases verbatim from v0.1.0. No security logic touched. Verified: go build + root/compression/chrootarchive tests pass; the only failures (overlayfs TestOverlayTar*) fail identically on pristine upstream v0.3.0. Portainer 2.45.0 compiles clean against it. Fork commit db33272, tag 471f976f. Retire this replace when docker/cli adopts go-archive >=0.3.0."
    },
    {
      "commit": "befa7a3f9bb8d55d4bcef2deaaa98787305bb207",
      "new": "github.com/ReadyStackFree/cli",
      "old": "github.com/docker/cli",
      "version": "v28.5.2-cve-r2+incompatible",
      "why": "CVE-2025-15558 (GHSA-p436-gjf2-799p, HIGH, CVSS4 7.0: CLI plugin search path on Windows). Fixed upstream only in v29.2.0, by commit 13759330 (cli-plugins/manager: remove legacy system-wide cli-plugin path; one line in manager_windows.go). Every v29 release moved the client API to github.com/moby/moby/{client,api}: Portainer 2.45.2's own pkg/libstack/swarm and buildx v0.29.1 pass dockerCLI.Client() as a github.com/docker/docker client, so v29 does not compile (chain 505), and no v28.x release carries the fix (v28.5.2, 2025-11-05, is the last). Fork = upstream v28.5.2 (ecc69426) + that commit applied unchanged; manager_windows.go is byte-identical to v29.2.0's (blob b42b713e). The Linux build of the module compiles the same code as before; the fix is in its Windows build. CONTROL 2026-10-10 (pristine v28.5.2 vs fork, same golang container): go test ./cli-plugins/... identical (all ok); GOOS=windows vet, test build and ./cmd/docker build identical (ok). This replace also overrides the docker/cli v29.2.1 that buildkit 0.28.1 requires. go.sum h1:seJimHWBTnV/VSrzgJAvDoDW4WfIACgIjBC2SdBwYFI= (go.mod h1:PumRSACRv5cKyJ6wEhcqm7V1s0Gn7fIalOXIJkeBwBc=). Source: runstate/held-auto/portainer-fork-cli-v28.5.2-cve-r1.patch; local fork commit 00fedb16, signed tag SHA: . Retire when Portainer moves to docker/cli >= v29.2.0. Signed tag v28.5.2-cve-r2 (GitHub-verified; r1 on the same commit has an unverifiable tagger email and is immutable), commit befa7a3f9bb8d55d4bcef2deaaa98787305bb207, pushed 2026-10-10."
    },
    {
      "commit": "1b0df585b49e8d0d183e768d3a79e67715c14498",
      "new": "github.com/ReadyStackFree/compose/v2",
      "old": "github.com/docker/compose/v2",
      "version": "v2.40.3-cve-r1",
      "why": "Enables the buildkit 0.28.1 fix (CVE-2026-33747, CVE-2026-33748). compose v2.40.3 is the last github.com/docker/compose/v2 release (the next, v5, is a new module path Portainer does not import) and it sets authprovider.DockerAuthProviderConfig.ConfigFile, which buildkit 339740431f8a removed (first released in 0.27.0), so no compose/v2 release compiles against a fixed buildkit. Fork = upstream v2.40.3 (49b1c1e9) + one line in pkg/compose/build.go, `ConfigFile: s.configFile()` -> `AuthConfigProvider: authprovider.LoadAuthConfig(s.configFile())` (BuildKit's own adapter from the same commit, the call buildx uses) + go.mod requiring buildkit v0.28.1. No security logic touched; buildkit stays pristine upstream, so Scout keeps matching buildkit's own advisories. CONTROL 2026-10-10 (pristine vs fork, same container): go test ./pkg/compose/... ./pkg/api/... ./cmd/compose/... ./cmd/formatter/... identical (5/5 packages ok, 44/44 pkg/compose tests pass); a credential test through toBuildOptions' BuildKit auth session (Docker Hub host mapping, user/password, identity token, unknown host, cached second call) returns identical results. go.sum h1:w23LMLj2YGsdD0G3HZoeXQIPDr4SQrInokk1gL6rFlM= (go.mod h1:K+tSjWb6YqQhE1eqpLmW5Xitidt0DUAcm6P1oo7RktM=). Source: runstate/held-auto/portainer-fork-compose-v2.40.3-cve-r1.patch; local fork commit f7b09184, signed tag SHA: . Retire when Portainer leaves compose/v2. Signed tag v2.40.3-cve-r1 (GitHub-verified), commit 1b0df585b49e8d0d183e768d3a79e67715c14498, pushed 2026-10-10."
    }
